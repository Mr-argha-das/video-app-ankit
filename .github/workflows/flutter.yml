name: Flutter CI — Build APK

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"

      - name: Flutter precache Android
        run: flutter precache --android

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1

      - name: Build APK debug
        working-directory: flutter_app
        run: flutter build apk --debug 2>&1

      - name: List debug APKs
        working-directory: flutter_app
        run: |
          find build -name "*.apk" 2>/dev/null || echo "No debug APKs found"

      - name: Build APK release
        working-directory: flutter_app
        run: flutter build apk --release 2>&1

      - name: List release APKs
        working-directory: flutter_app
        run: |
          find build -name "*.apk" 2>/dev/null || echo "No release APKs found"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
