name: Flutter CI — Build Two APKs

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  pull_request:
    branches: [arena/01a0d32d-video-app-ankit]

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1 || true

      - name: Try debug build Orange
        working-directory: flutter_app
        run: flutter build apk --debug --target lib/main_orange.dart --dart-define=API_BASE_URL=https://videcall1.duckdns.org || echo "DEBUG BUILD FAILED"

      - name: Try release build Orange
        working-directory: flutter_app
        run: flutter build apk --release --target lib/main_orange.dart --dart-define=API_BASE_URL=https://videcall1.duckdns.org || echo "RELEASE BUILD FAILED"

      - name: List build outputs
        working-directory: flutter_app
        run: |
          find build -name "*.apk" 2>/dev/null || echo "No APKs found"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "No output dir"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apks
          path: |
            flutter_app/build/**/*.apk
          retention-days: 14
