name: Flutter CI — Build Two APKs

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1

      - name: Create local.properties for Gradle
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_DIR" > flutter_app/android/local.properties
          cat flutter_app/android/local.properties

      - name: Build Orange APK (videcall1)
        working-directory: flutter_app
        run: |
          flutter build apk --release --target lib/main_orange.dart > build_orange.log 2>&1
          ORANGE_EXIT=$?
          cat build_orange.log
          mkdir -p build/orange
          APK_PATH=$(find build -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build/orange/app-orange-release.apk
            echo "Orange APK copied successfully"
          fi
          exit $ORANGE_EXIT

      - name: Build Dating APK (videcall2)
        working-directory: flutter_app
        run: |
          flutter build apk --release --target lib/main_dating.dart > build_dating.log 2>&1
          DATING_EXIT=$?
          cat build_dating.log
          mkdir -p build/dating
          APK_PATH=$(find build -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build/dating/app-dating-release.apk
            echo "Dating APK copied successfully"
          fi
          exit $DATING_EXIT

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            flutter_app/build_orange.log
            flutter_app/build_dating.log
            flutter_app/build/orange/app-orange-release.apk
            flutter_app/build/dating/app-dating-release.apk
          retention-days: 14
