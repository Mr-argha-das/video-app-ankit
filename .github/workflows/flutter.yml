name: Flutter CI — Build APK

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1

      - name: Create local.properties for Gradle
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_DIR" > flutter_app/android/local.properties
          cat flutter_app/android/local.properties

      - name: Build APK (set -eo pipefail to catch errors)
        working-directory: flutter_app
        run: |
          set -eo pipefail
          flutter build apk --release --verbose 2>&1 | tee build_output.log
          echo "EXIT_CODE=$?" >> build_output.log

      - name: Find APKs
        working-directory: flutter_app
        run: |
          find build -name "*.apk" 2>/dev/null || echo "No APKs found"

      - name: Save log to repo
        if: always()
        run: |
          cp flutter_app/build_output.log build_output.log 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add build_output.log 2>/dev/null || true
          git commit -m "ci: save build log" 2>/dev/null || true
          git push 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: flutter_app/build_output.log
          retention-days: 14

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
