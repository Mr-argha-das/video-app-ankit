name: Flutter CI — Auto Build APKs

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  pull_request:
    branches: [arena/01a0d32d-video-app-ankit]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (needed for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"
          cache: true

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v || true

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get --verbose || true

      - name: Accept Android SDK licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Run flutter analyze
        working-directory: flutter_app
        run: flutter analyze 2>&1 | tee analyze_output.txt || true

      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: flutter_app/analyze_output.txt
          retention-days: 1

      - name: Build Orange APK (videcall1.duckdns.org)
        working-directory: flutter_app
        run: |
          flutter build apk --release \
            --flavor orange \
            --dart-define=API_BASE_URL=https://videcall1.duckdns.org || true

      - name: Build Dating APK (videcall2.duckdns.org)
        working-directory: flutter_app
        run: |
          flutter build apk --release \
            --flavor dating \
            --dart-define=DATING_API_BASE_URL=https://videcall2.duckdns.org || true

      - name: Upload Orange APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-orange-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-orange-release.apk
          retention-days: 14

      - name: Upload Dating APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-dating-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-dating-release.apk
          retention-days: 14
