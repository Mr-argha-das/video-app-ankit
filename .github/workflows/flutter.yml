name: Flutter CI — Build APK

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1 || true

      - name: Build default APK (main.dart)
        working-directory: flutter_app
        run: |
          flutter build apk --release 2>&1 | tee build_output.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}"

      - name: List build outputs
        working-directory: flutter_app
        run: |
          find build -name "*.apk" 2>/dev/null || echo "No APKs found"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "No output dir"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: flutter_app/build_output.txt
          retention-days: 1

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
