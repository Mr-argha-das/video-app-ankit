name: Flutter CI — Build Two APKs

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  pull_request:
    branches: [arena/01a0d32d-video-app-ankit]

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1 || true

      - name: Build Orange APK
        working-directory: flutter_app
        run: flutter build apk --release --target lib/main_orange.dart --dart-define=API_BASE_URL=https://videcall1.duckdns.org

      - name: Rename Orange APK
        working-directory: flutter_app
        run: |
          mkdir -p build/orange
          cp build/app/outputs/flutter-apk/app-release.apk build/orange/app-orange-release.apk 2>/dev/null || echo "ORANGE APK NOT FOUND"

      - name: Build Dating APK
        working-directory: flutter_app
        run: flutter build apk --release --target lib/main_dating.dart --dart-define=DATING_API_BASE_URL=https://videcall2.duckdns.org

      - name: Rename Dating APK
        working-directory: flutter_app
        run: |
          mkdir -p build/dating
          cp build/app/outputs/flutter-apk/app-release.apk build/dating/app-dating-release.apk 2>/dev/null || echo "DATING APK NOT FOUND"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apks
          path: |
            flutter_app/build/orange/app-orange-release.apk
            flutter_app/build/dating/app-dating-release.apk
          retention-days: 14
