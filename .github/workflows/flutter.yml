name: Flutter CI — Build Two APKs

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  pull_request:
    branches: [arena/01a0d32d-video-app-ankit]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1 || true

      - name: Build Orange APK (videcall1)
        working-directory: flutter_app
        run: |
          flutter build apk --release --verbose \
            --target lib/main_orange.dart \
            --dart-define=API_BASE_URL=https://videcall1.duckdns.org 2>&1 | tee build_orange.log || true
          echo "---BUILD ORANGE LOG---"
          cat build_orange.log
          mkdir -p build/orange
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/orange/app-orange-release.apk
            echo "Orange APK copied successfully"
          else
            echo "Orange APK NOT FOUND at expected path"
            find build -name "*.apk" 2>/dev/null || echo "No APKs found in build dir"
          fi

      - name: Build Dating APK (videcall2)
        working-directory: flutter_app
        run: |
          flutter build apk --release --verbose \
            --target lib/main_dating.dart \
            --dart-define=DATING_API_BASE_URL=https://videcall2.duckdns.org 2>&1 | tee build_dating.log || true
          echo "---BUILD DATING LOG---"
          cat build_dating.log
          mkdir -p build/dating
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/dating/app-dating-release.apk
            echo "Dating APK copied successfully"
          else
            echo "Dating APK NOT FOUND at expected path"
            find build -name "*.apk" 2>/dev/null || echo "No APKs found in build dir"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            flutter_app/build_orange.log
            flutter_app/build_dating.log
          retention-days: 1

      - name: Upload Orange APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-orange-apk-videcall1
          path: flutter_app/build/orange/app-orange-release.apk
          retention-days: 14

      - name: Upload Dating APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-dating-apk-videcall2
          path: flutter_app/build/dating/app-dating-release.apk
          retention-days: 14
