name: Flutter CI — Build Two APKs

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  pull_request:
    branches: [arena/01a0d32d-video-app-ankit]

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Write local.properties for Gradle
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          echo "Flutter SDK dir: $FLUTTER_DIR"
          echo "flutter.sdk=$FLUTTER_DIR" > flutter_app/android/local.properties
          cat flutter_app/android/local.properties

      - name: Run flutter analyze (capture output, don't fail)
        working-directory: flutter_app
        run: flutter analyze 2>&1 | tee analyze_output.txt || true

      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: flutter_app/analyze_output.txt
          retention-days: 1

      - name: Build Orange APK (videcall1.duckdns.org)
        working-directory: flutter_app
        run: |
          flutter clean
          flutter precache --android
          flutter build apk --release --verbose \
            --target lib/main_orange.dart \
            --dart-define=API_BASE_URL=https://videcall1.duckdns.org
          mkdir -p build/orange
          cp build/app/outputs/flutter-apk/app-release.apk build/orange/app-orange-release.apk

      - name: Build Dating APK (videcall2.duckdns.org)
        working-directory: flutter_app
        run: |
          flutter clean
          flutter precache --android
          flutter build apk --release --verbose \
            --target lib/main_dating.dart \
            --dart-define=DATING_API_BASE_URL=https://videcall2.duckdns.org
          mkdir -p build/dating
          cp build/app/outputs/flutter-apk/app-release.apk build/dating/app-dating-release.apk

      - name: Upload Orange APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-orange-apk
          path: flutter_app/build/orange/app-orange-release.apk
          retention-days: 14

      - name: Upload Dating APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-dating-apk
          path: flutter_app/build/dating/app-dating-release.apk
          retention-days: 14
