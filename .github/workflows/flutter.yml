name: Flutter CI — Build Two APKs

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  pull_request:
    branches: [arena/01a0d32d-video-app-ankit]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1

      - name: Create local.properties for Gradle
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_DIR" > flutter_app/android/local.properties
          cat flutter_app/android/local.properties

      - name: Dart analyze
        working-directory: flutter_app
        run: flutter analyze 2>&1 | tee analyze.log || true

      - name: Build Orange APK
        working-directory: flutter_app
        run: |
          set -eo pipefail
          flutter build apk --release \
            --target lib/main_orange.dart \
            --dart-define=API_BASE_URL=https://videcall1.duckdns.org 2>&1 | tee build_orange.log
          mkdir -p build/orange
          APK_PATH=$(find build -name "*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" build/orange/app-orange-release.apk

      - name: Build Dating APK
        working-directory: flutter_app
        run: |
          set -eo pipefail
          flutter build apk --release \
            --target lib/main_dating.dart \
            --dart-define=DATING_API_BASE_URL=https://videcall2.duckdns.org 2>&1 | tee build_dating.log
          mkdir -p build/dating
          APK_PATH=$(find build -name "*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" build/dating/app-dating-release.apk

      - name: Save logs to repo
        if: always()
        run: |
          mkdir -p ci-logs
          cp flutter_app/analyze.log ci-logs/analyze.log 2>/dev/null || true
          cp flutter_app/build_orange.log ci-logs/build_orange.log 2>/dev/null || true
          cp flutter_app/build_dating.log ci-logs/build_dating.log 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ci-logs/ 2>/dev/null || true
          git commit -m "ci: save build logs" 2>/dev/null || true
          git push 2>/dev/null || true

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            flutter_app/analyze.log
            flutter_app/build_orange.log
            flutter_app/build_dating.log
          retention-days: 14

      - name: Upload Orange APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-orange-apk-videcall1
          path: flutter_app/build/orange/app-orange-release.apk
          retention-days: 14

      - name: Upload Dating APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-dating-apk-videcall2
          path: flutter_app/build/dating/app-dating-release.apk
          retention-days: 14
