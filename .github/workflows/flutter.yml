name: Flutter CI — Minimal Build Test

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1

      - name: Create local.properties for Gradle
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_DIR" > flutter_app/android/local.properties
          cat flutter_app/android/local.properties

      - name: Build APK release (minimal, no target)
        working-directory: flutter_app
        run: |
          set +e
          flutter build apk --release --verbose 2>&1 | tee build_minimal.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT_CODE" >> build_minimal.log
          exit $EXIT_CODE

      - name: Find APKs
        if: always()
        working-directory: flutter_app
        run: |
          find build -name "*.apk" 2>/dev/null || echo "No APKs found"

      - name: Save log to repo
        if: always()
        run: |
          mkdir -p ci-logs
          cp flutter_app/build_minimal.log ci-logs/build_minimal.log 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ci-logs/
          git commit -m "ci: save minimal build log" || true
          git push || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-minimal-log
          path: flutter_app/build_minimal.log
          retention-days: 14
