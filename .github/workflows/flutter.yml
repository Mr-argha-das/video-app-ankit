name: Flutter CI — Build APK

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1

      - name: Build APK and capture output
        working-directory: flutter_app
        run: |
          flutter build apk --release --verbose 2>&1 | tee build_output.txt
          echo "EXIT_CODE=$?" >> build_output.txt

      - name: Find any APKs
        working-directory: flutter_app
        run: |
          echo "=== Searching for APKs ==="
          find . -name "*.apk" 2>/dev/null || echo "No APKs found anywhere"
          echo "=== Build output dir ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "No flutter-apk dir"
          echo "=== All build dirs ==="
          find build -type d 2>/dev/null || echo "No build dir"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-txt
          path: flutter_app/build_output.txt
          retention-days: 14

      - name: Upload any APKs found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            flutter_app/build/**/*.apk
          retention-days: 14
