name: Flutter CI — Build Two APKs

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.x"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1

      - name: Create local.properties for Gradle
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_DIR" > flutter_app/android/local.properties
          cat flutter_app/android/local.properties

      - name: Build Orange APK (videcall1) — swap main.dart
        working-directory: flutter_app
        run: |
          cp lib/main.dart lib/main.dart.bak
          cp lib/main_orange.dart lib/main.dart
          set +e
          flutter build apk --release --verbose 2>&1 | tee build_orange.log
          ORANGE_EXIT=${PIPESTATUS[0]}
          echo "ORANGE_EXIT_CODE=$ORANGE_EXIT" >> build_orange.log
          cp lib/main.dart.bak lib/main.dart
          rm lib/main.dart.bak
          if [ "$ORANGE_EXIT" -ne 0 ]; then
            cp build_orange.log ../ci-logs/build_orange.log 2>/dev/null || mkdir -p ../ci-logs && cp build_orange.log ../ci-logs/build_orange.log
            exit $ORANGE_EXIT
          fi

      - name: Build Dating APK (videcall2) — swap main.dart
        working-directory: flutter_app
        run: |
          cp lib/main.dart lib/main.dart.bak
          cp lib/main_dating.dart lib/main.dart
          set +e
          flutter build apk --release --verbose 2>&1 | tee build_dating.log
          DATING_EXIT=${PIPESTATUS[0]}
          echo "DATING_EXIT_CODE=$DATING_EXIT" >> build_dating.log
          cp lib/main.dart.bak lib/main.dart
          rm lib/main.dart.bak
          if [ "$DATING_EXIT" -ne 0 ]; then
            cp build_dating.log ../ci-logs/build_dating.log 2>/dev/null || mkdir -p ../ci-logs && cp build_dating.log ../ci-logs/build_dating.log
            exit $DATING_EXIT
          fi

      - name: Save build logs to repo
        if: always()
        run: |
          mkdir -p ci-logs
          cp flutter_app/build_orange.log ci-logs/build_orange.log 2>/dev/null || true
          cp flutter_app/build_dating.log ci-logs/build_dating.log 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ci-logs/
          git commit -m "ci: save build logs" || true
          git push || true

      - name: Upload Orange APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-orange-apk-videcall1
          path: flutter_app/build/orange-app-release.apk
          retention-days: 14

      - name: Upload Dating APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-dating-apk-videcall2
          path: flutter_app/build/dating-app-release.apk
          retention-days: 14
