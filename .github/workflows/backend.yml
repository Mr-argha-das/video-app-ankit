name: Backend CI (FastAPI)

on:
  push:
    branches: [arena/01a0d32d-video-app-ankit]
  pull_request:
    branches: [arena/01a0d32d-video-app-ankit]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify app imports cleanly
        env:
          SECRET_KEY: test-secret-key-for-ci-do-not-use-in-production
          ADMIN_PASSWORD: Admin@123
          MONGODB_URL: mongodb://localhost:27017
        run: |
          python -c "import main; print('main imported OK')"

      - name: Lint Python files
        run: |
          pip install ruff
          ruff check app/ main.py || true
